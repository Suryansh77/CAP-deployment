apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-egress-proxy
  namespace: customer-egress
  labels:
    app.kubernetes.io/name: customer-egress-proxy
    app.kubernetes.io/component: egress-proxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: customer-egress-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: customer-egress-proxy
        app.kubernetes.io/component: egress-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: mitmproxy
          image: host.docker.internal:5001/cap/mitmproxy@sha256:62d266a86ee95187217866c0e35487837498daa3aa1cdce37d256f07e198a47b
          imagePullPolicy: IfNotPresent
          command:
            - mitmdump
          args:
            - --mode
            - regular@8080
            - --set
            - confdir=/home/mitmproxy/.mitmproxy
            - --set
            - ssl_insecure=false
            - --set
            - ssl_verify_upstream_trusted_ca=/upstream-ca/upstream-ca.crt
            - --scripts
            - /config/allowlist.py
          env:
            - name: HOME
              value: /home/mitmproxy
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: proxy
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: proxy
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: proxy
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: mitmproxy-confdir
              mountPath: /home/mitmproxy/.mitmproxy
            - name: proxy-config
              mountPath: /config
              readOnly: true
            - name: upstream-ca
              mountPath: /upstream-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp

      initContainers:
        - name: initialize-mitmproxy
          image: host.docker.internal:5001/cap/mitmproxy@sha256:62d266a86ee95187217866c0e35487837498daa3aa1cdce37d256f07e198a47b
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              cp /customer-ca/mitmproxy-ca.pem \
                /home/mitmproxy/.mitmproxy/mitmproxy-ca.pem

              cp /customer-ca/mitmproxy-ca-cert.pem \
                /home/mitmproxy/.mitmproxy/mitmproxy-ca-cert.pem

              chmod 600 \
                /home/mitmproxy/.mitmproxy/mitmproxy-ca.pem

              chmod 644 \
                /home/mitmproxy/.mitmproxy/mitmproxy-ca-cert.pem

              cat > /home/mitmproxy/.mitmproxy/config.yaml <<'EOF'
              ssl_insecure: false
              ssl_verify_upstream_trusted_ca: /upstream-ca/upstream-ca.crt
              EOF

              chmod 644 \
                /home/mitmproxy/.mitmproxy/config.yaml

              echo "MITMPROXY_CONFIG_CREATED"
              cat /home/mitmproxy/.mitmproxy/config.yaml
          env:
            - name: HOME
              value: /home/mitmproxy
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: customer-ca
              mountPath: /customer-ca
              readOnly: true
            - name: upstream-ca
              mountPath: /upstream-ca
              readOnly: true
            - name: mitmproxy-confdir
              mountPath: /home/mitmproxy/.mitmproxy
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: customer-ca
          secret:
            secretName: customer-egress-ca
            defaultMode: 0444

        - name: upstream-ca
          secret:
            secretName: customer-egress-upstream-ca
            defaultMode: 0444

        - name: proxy-config
          configMap:
            name: customer-egress-proxy-config

        - name: mitmproxy-confdir
          emptyDir: {}

        - name: tmp
          emptyDir: {}