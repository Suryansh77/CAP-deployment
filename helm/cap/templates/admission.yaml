{{- if .Values.admission.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "cap.fullname" . }}-private-registry
spec:
  failurePolicy: Fail

  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
        scope: "Namespaced"
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/ephemeralcontainers"]
        scope: "Namespaced"

    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}

  validations:
    - expression: >
        object.spec.containers.all(c,
          c.image.startsWith({{ printf "%q" .Values.admission.allowedImageRegistry }})
        )
        &&
        (
          !has(object.spec.initContainers)
          ||
          object.spec.initContainers.all(c,
            c.image.startsWith({{ printf "%q" .Values.admission.allowedImageRegistry }})
          )
        )
        &&
        (
          !has(object.spec.ephemeralContainers)
          ||
          object.spec.ephemeralContainers.all(c,
            c.image.startsWith({{ printf "%q" .Values.admission.allowedImageRegistry }})
          )
        )
      message: "All Cap Pod container images, including init and ephemeral containers, must come from the approved private registry."
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "cap.fullname" . }}-private-registry
spec:
  policyName: {{ include "cap.fullname" . }}-private-registry
  validationActions:
    - Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
{{- end }}