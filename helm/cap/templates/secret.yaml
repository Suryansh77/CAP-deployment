apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cap.fullname" . }}-secrets
  labels:
    {{- include "cap.labels" . | nindent 4 }}
type: Opaque
stringData:
  NEXTAUTH_SECRET: {{ .Values.secrets.nextAuthSecret | quote }}
  DATABASE_ENCRYPTION_KEY: {{ .Values.secrets.databaseEncryptionKey | quote }}
  MEDIA_SERVER_WEBHOOK_SECRET: {{ .Values.secrets.mediaServerWebhookSecret | quote }}

  MYSQL_PASSWORD: {{ .Values.secrets.mysqlPassword | quote }}
  MYSQL_ROOT_PASSWORD: {{ .Values.secrets.mysqlRootPassword | quote }}

  MINIO_ROOT_USER: {{ .Values.secrets.minioRootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.secrets.minioRootPassword | quote }}

  CAP_AWS_ACCESS_KEY: {{ .Values.secrets.minioRootUser | quote }}
  CAP_AWS_SECRET_KEY: {{ .Values.secrets.minioRootPassword | quote }}

  DATABASE_URL: {{ printf "mysql://%s:%s@%s:%d/%s" .Values.config.database.user .Values.secrets.mysqlPassword (include "cap.fullname" . | printf "%s-mysql") (int .Values.mysql.service.port) .Values.config.database.name | quote }}