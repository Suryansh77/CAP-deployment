apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cap.fullname" . }}-minio-setup
  labels:
    {{- include "cap.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio-setup
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "cap.name" . }}
        app.kubernetes.io/component: minio-setup
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "cap.serviceAccountName" . }}
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio-setup
          image: "{{ include "cap.image" .Values.images.minioMc }}"
          imagePullPolicy: {{ .Values.images.minioMc.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              until mc ready "http://{{ include "cap.fullname" . }}-minio:{{ .Values.minio.service.port }}"; do
                sleep 2
              done

              mc alias set capminio \
                "http://{{ include "cap.fullname" . }}-minio:{{ .Values.minio.service.port }}" \
                "$MINIO_ROOT_USER" \
                "$MINIO_ROOT_PASSWORD"

              mc mb "capminio/{{ .Values.config.s3.bucket }}" --ignore-existing

              echo "MINIO_BUCKET_READY"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "cap.fullname" . }}-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cap.fullname" . }}-secrets
                  key: MINIO_ROOT_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
