apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-media-server-to-web
  namespace: cap
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: media-server
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: web
      ports:
        - protocol: TCP
          port: 3000